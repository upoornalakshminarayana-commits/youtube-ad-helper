name: Build YT Ad Helper Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Enable Windows Developer Mode
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -PropertyType DWORD -Force

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Pre-cache electron-builder dependencies
        shell: powershell
        run: |
          $baseCache = "$env:LOCALAPPDATA\electron-builder\Cache"
          
          # 1. winCodeSign
          $wcsDir = "$baseCache\winCodeSign\winCodeSign-2.6.0"
          if (!(Test-Path $wcsDir)) {
            New-Item -ItemType Directory -Force -Path $wcsDir | Out-Null
            $archive = "$env:TEMP\winCodeSign.7z"
            Invoke-WebRequest -Uri "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z" -OutFile $archive
            7z x $archive "-o$wcsDir" "-xr!darwin" -y
            Remove-Item -Force $archive
          }

          # 2. nsis
          $nsisDir = "$baseCache\nsis\nsis-3.0.4.1"
          if (!(Test-Path $nsisDir)) {
            New-Item -ItemType Directory -Force -Path $nsisDir | Out-Null
            $archive = "$env:TEMP\nsis.7z"
            Invoke-WebRequest -Uri "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z" -OutFile $archive
            7z x $archive "-o$nsisDir" -y
            Remove-Item -Force $archive
          }

          # 3. nsis-resources
          $resDir = "$baseCache\nsis\nsis-resources-3.4.1"
          if (!(Test-Path $resDir)) {
            New-Item -ItemType Directory -Force -Path $resDir | Out-Null
            $archive = "$env:TEMP\nsis-resources.7z"
            Invoke-WebRequest -Uri "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-resources-3.4.1/nsis-resources-3.4.1.7z" -OutFile $archive
            7z x $archive "-o$resDir" -y
            Remove-Item -Force $archive
          }

      - name: Build Windows Installer
        shell: powershell
        run: |
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c npx electron-builder --win nsis" -NoNewWindow -PassThru -Wait -RedirectStandardOutput "build_stdout.log" -RedirectStandardError "build_stderr.log"
          if ($p.ExitCode -ne 0) {
            if (Test-Path "build_stderr.log") {
              Get-Content "build_stderr.log" | ForEach-Object { Write-Host "::error title=Stderr::$_" }
            }
            if (Test-Path "build_stdout.log") {
              Get-Content "build_stdout.log" -Tail 60 | ForEach-Object { Write-Host "::error title=Stdout::$_" }
            }
            exit $p.ExitCode
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_*.log
          if-no-files-found: ignore

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Ad-Helper-Setup
          path: dist/*.exe
          if-no-files-found: error
