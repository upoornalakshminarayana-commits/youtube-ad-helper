<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2222"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff0000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="24.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Play Button Triangle Background -->
  <path d="M48 38 L92 64 L48 90 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Accelerator Lightning Bolt -->
  <polygon points="68,36 50,66 65,66 60,94 82,60 67,60" fill="#ff0000" stroke="#ffffff" stroke-width="2" stroke-linejoin="miter"/>
</svg>
